modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 两个前置都是软依赖:运行时由 ModList.isLoaded 判断,缺任一则本模组什么都不做。
[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=false
    versionRange="[5,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="apotheosis"
    mandatory=false
    versionRange="[7,)"
    ordering="AFTER"
    side="BOTH"
